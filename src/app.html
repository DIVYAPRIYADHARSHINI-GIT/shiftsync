<!doctype html>
<html lang="en" class="h-full">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta
			name="description"
			content="ShiftSync - a free staff roster planner. Plan shifts. Keep it fair. Your data stays in this browser."
		/>
		<meta name="theme-color" content="#0B6E4F" />
		<script>
			// Apply the saved theme and density before first paint so there is no flash.
			try {
				const raw = localStorage.getItem('shiftsync:data:v1');
				const settings = raw ? JSON.parse(raw)?.settings : null;
				const theme = settings?.theme ?? 'system';
				const dark =
					theme === 'dark' ||
					((theme === 'system' || !theme) &&
						window.matchMedia('(prefers-color-scheme: dark)').matches);
				if (dark) document.documentElement.classList.add('dark');
				if (settings?.density === 'compact') document.documentElement.classList.add('compact');
			} catch (e) {
				// Storage blocked - fall back to the light interface.
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="h-full">
		<div style="display: contents" class="h-full">%sveltekit.body%</div>
	</body>
</html>
